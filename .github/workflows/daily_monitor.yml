name: Zinc Intelligence V2.7 Official-First

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
      - "public/**"
  workflow_dispatch:
    inputs:
      current_inventory_t:
        description: "Current usable zinc inventory (t). Leave blank to carry forward previous value."
        required: false
        type: string
      demand_60d_t:
        description: "Forecast zinc demand for next 60 days (t). Leave blank to carry forward previous value."
        required: false
        type: string
  schedule:
    # UTC: 02:30 = 10:30 Taiwan; 09:30 = 17:30 Taiwan.
    # Accuracy-first: wait for delayed official/reference data rather than chase incomplete realtime values.
    - cron: "30 2 * * 1-5"
    - cron: "30 9 * * 1-5"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: zinc-intelligence-v27-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile
        run: python -m compileall -q .

      - name: Smoke test
        run: python smoke_test.py

  build:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    outputs:
      state_sha: ${{ steps.state_sha.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Refresh verified state before the single writer runs
        run: |
          git fetch origin "${GITHUB_REF_NAME}"
          # An older run must not silently execute code that changed upstream.
          if ! git diff --quiet HEAD "origin/${GITHUB_REF_NAME}" -- . ':!data' ':!public'; then
            echo "Code changed since this run started; a newer run must rebuild." >&2
            exit 1
          fi
          # Carry forward the latest committed history before calculating this run.
          git reset --hard "origin/${GITHUB_REF_NAME}"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run intelligence pipeline
        env:
          CURRENT_INVENTORY_T: ${{ github.event.inputs.current_inventory_t || '' }}
          DEMAND_60D_T: ${{ github.event.inputs.demand_60d_t || '' }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

          # Official/free public sources and accuracy-first reference fallbacks.
          LME_PUBLIC_ZINC_URL: "https://www.lme.com/en/metals/non-ferrous/lme-zinc"
          ENABLE_GRILLO_FALLBACK: "1"
          ENABLE_WESTMETALL_FALLBACK: "1"
          ENABLE_SMM_PUBLIC_ZINC: "1"

          # Optional licensed official sources. They automatically outrank public/reference fallbacks.
          LME_XML_USERNAME: ${{ secrets.LME_XML_USERNAME }}
          LME_XML_PASSWORD: ${{ secrets.LME_XML_PASSWORD }}
          LME_XML_CLIENT_ID: ${{ secrets.LME_XML_CLIENT_ID }}
          LME_WAREHOUSE_REPORT_URL: ${{ secrets.LME_WAREHOUSE_REPORT_URL }}
          TC_API_URL: ${{ secrets.TC_API_URL }}
          TC_API_KEY: ${{ secrets.TC_API_KEY }}
          CANDLE_API_KEY: ${{ secrets.CANDLE_API_KEY }}
          ZINC_DAILY_CANDLE_URL: ${{ secrets.ZINC_DAILY_CANDLE_URL }}
          ZINC_1H_CANDLE_URL: ${{ secrets.ZINC_1H_CANDLE_URL }}
          ZINC_15M_CANDLE_URL: ${{ secrets.ZINC_15M_CANDLE_URL }}

          # Backward-compatible adapters.
          ZINC_MARKET_API_URL: ${{ secrets.ZINC_MARKET_API_URL }}
          ZINC_MARKET_API_KEY: ${{ secrets.ZINC_MARKET_API_KEY }}
          ZINC_DAILY_CSV_URL: ${{ secrets.ZINC_DAILY_CSV_URL }}
          ZINC_1H_CSV_URL: ${{ secrets.ZINC_1H_CSV_URL }}
          ZINC_15M_CSV_URL: ${{ secrets.ZINC_15M_CSV_URL }}
        run: python main.py

      - name: Validate data before deploy
        run: python validate_deploy.py

      - name: Persist verified state and research journals
        run: |
          git config user.name "zinc-intelligence-bot"
          git config user.email "zinc-intelligence-bot@users.noreply.github.com"
          git add data public
          if git diff --cached --quiet; then
            echo "No state changes"
          else
            git commit -m "chore: update verified zinc intelligence state"
            # No rebase of generated JSON: a concurrent remote write is a failed
            # precondition, never a conflict to auto-resolve or overwrite.
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Capture deployed state commit
        id: state_sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  verify-production:
    if: github.event_name != 'pull_request'
    needs: [build, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact deployed state
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.state_sha }}

      - name: Verify production Pages against deployed snapshot
        env:
          PRODUCTION_URL: ${{ needs.deploy.outputs.page_url }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          DEPLOYED_STATE_SHA: ${{ needs.build.outputs.state_sha }}
        run: python verify_production.py
