name: One approved LINE A-B final preview
on:
  push:
    branches: [line-ab-final-20261016]
    paths: [.github/workflows/line-ab-final.yml]
permissions:
  contents: read
jobs:
  send-one-approved-line:
    if: >-
      github.event.head_commit.message == 'test: send one approved LINE A-B final preview 2026-10-16'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 0bee3ee0e8b1e73ebf0b8769a38d885bd422ac34
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Send one approved message after verified deployment
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: |
          python - <<'PY'
          import os,json
          from datetime import datetime, timezone
          import requests
          from zincintel.line_flex import build_daily_flex,validate_structure
          from zincintel.line_notify import validate_line_message
          assert datetime.now(timezone.utc) < datetime.fromisoformat('2026-10-17T00:00:00+00:00'), 'Approval window expired'
          run=requests.get('https://api.github.com/repos/ala927832-create/zinc-intelligence-v26/actions/runs/38904367040',timeout=20)
          run.raise_for_status()
          assert run.json()['conclusion']=='success', 'Production workflow has not passed'
          snapshot=json.load(open('data/latest_snapshot.json'))
          message=build_daily_flex(snapshot)
          message['altText']='研究面板A／B改版完成｜正式資料試傳｜閱讀Today'
          validate_structure(message)
          token=os.environ['LINE_CHANNEL_ACCESS_TOKEN'].strip()
          user=os.environ['LINE_USER_ID'].strip()
          assert token and user, 'LINE configuration missing'
          validate_line_message(message,token)
          response=requests.post('https://api.line.me/v2/bot/message/push',
              headers={'Authorization':'Bearer '+token,'Content-Type':'application/json',
                       'X-Line-Retry-Key':'2bbf70cf-4c2f-4ddc-8b72-279a3d850f17'},
              json={'to':user,'messages':[message]},timeout=20)
          if response.status_code==409 and response.headers.get('x-line-accepted-request-id'):
              print('LINE_ALREADY_ACCEPTED_SAME_APPROVAL: no duplicate message')
          else:
              response.raise_for_status()
              print('LINE_PUSH_ACCEPTED_ONE_MESSAGE: device receipt not independently verified')
          PY
